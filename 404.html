<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Sidan hittades inte | Babylon Capital AB</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root{color-scheme:dark;--navy:#071621;--panel:#0d2430;--teal:#4fc4c2;--gold:#c8a765;--text:#eef5f5;--muted:#abc0c5}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#123645 0,var(--navy) 58%);color:var(--text);font-family:Arial,sans-serif;padding:24px}
    main{width:min(720px,100%);padding:clamp(30px,7vw,64px);text-align:center;background:rgba(13,36,48,.9);border:1px solid rgba(79,196,194,.28);border-radius:24px;box-shadow:0 28px 80px rgba(0,0,0,.35)}
    img{width:112px;height:auto;margin-bottom:22px}
    .code{margin:0;color:var(--gold);font-size:clamp(54px,12vw,96px);font-weight:700;line-height:1}
    h1{font-size:clamp(28px,5vw,44px);margin:16px 0 14px}
    p{max-width:540px;margin:0 auto 28px;color:var(--muted);font-size:18px;line-height:1.6}
    .links{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
    a{display:inline-block;padding:13px 20px;border-radius:999px;border:1px solid var(--teal);color:var(--text);text-decoration:none;font-weight:700}
    a:first-child{background:var(--teal);color:var(--navy)}
    a:hover,a:focus-visible{transform:translateY(-2px);box-shadow:0 8px 24px rgba(79,196,194,.2)}
  </style>
</head>
<body>
  <main>
    <img src="/img/babylon-capital-logo.webp" alt="Babylon Capital AB" width="520" height="436">
    <p class="code" aria-label="Fel 404">404</p>
    <h1>Sidan hittades inte</h1>
    <p>Adressen kan vara felstavad eller sidan kan ha flyttats. Välj språk för att gå tillbaka till Babylon Capital.</p>
    <nav class="links" aria-label="Välj startsida">
      <a href="/">Svenska</a>
      <a href="/en/" lang="en">English</a>
      <a href="/es/" lang="es">Español</a>
    </nav>
  </main>
</body>
</html>
